name: 🤖 Auto-Update Football Trends & Insights

on:
  schedule:
    # รันทุกวันที่ 1 ของเดือน เวลา 00:00 UTC (07:00 Bangkok time)
    - cron: '0 0 1 * *'

  workflow_dispatch:  # อนุญาตให้รัน manual ได้

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          pip install google-generativeai requests

      - name: 🔍 Run trend update script
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
        run: |
          python scripts/update_trends.py

      - name: 📊 Check generated files
        run: |
          echo "=== Generated Files ==="
          ls -lh data/
          echo ""
          echo "=== trends.json preview ==="
          head -20 data/trends.json || echo "File not found"
          echo ""
          echo "=== insights.json preview ==="
          head -20 data/insights.json || echo "File not found"

      - name: 🚀 Commit and push changes
        run: |
          git config --global user.name "Claude AI Bot"
          git config --global user.email "automation@claude.ai"
          git add data/trends.json data/insights.json

          # Get current month/year
          MONTH=$(date +"%B %Y")

          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto-update: Football trends & insights - $MONTH"
            git push
            echo "✅ Successfully pushed updates!"
          fi
